<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body{font-family:Arial;padding:20px;background:#f4f4f4}
        h1{color:#007bff}
        table{width:100%;border-collapse:collapse;background:white;margin-top:20px}
        th,td{border:1px solid #ddd;padding:12px;text-align:left}
        th{background:#007bff;color:white}
        .delete-btn{background:red;color:white;border:none;padding:8px 12px;cursor:pointer;border-radius:4px}
    </style>
</head>
<body>
    <h1>Admin Panel - All Bookings</h1>
    <a href="/booking.html">← Back to Booking</a>
    <table id="bookingsTable"><thead><tr>
        <th>Name</th><th>Email</th><th>Service</th><th>Date</th><th>Time</th><th>Status</th><th>Action</th>
    </tr></thead><tbody></tbody></table>
<script>
async function loadBookings(){
    const res = await fetch('/api/bookings');
    const bookings = await res.json();
    const tbody = document.querySelector('tbody');
    tbody.innerHTML = '';
    bookings.forEach(b=>{
        tbody.innerHTML += `<tr>
            <td>${b.name}</td><td>${b.email}</td><td>${b.service}</td>
            <td>${b.date}</td><td>${b.time}</td><td>${b.status}</td>
            <td><button class="delete-btn" onclick="deleteBooking(${b.id})">Delete</button></td>
        </tr>`
    });
}
async function deleteBooking(id){
    if(confirm('Delete?')){
        await fetch(`/api/bookings/${id}`,{method:'DELETE'});
        loadBookings();
    }
}
loadBookings();
</script>
</body>
</html>
